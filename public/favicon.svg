<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background soft circle for maskable PWA icon -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#orange-grad)" stroke-width="12" opacity="0.2" filter="url(#glow)" />
  
  <!-- Stylized Dumbbell -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Central Bar -->
    <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#f4f4f5" />
    
    <!-- Left Plate Inner -->
    <rect x="-140" y="-40" width="30" height="80" rx="10" fill="url(#orange-grad)" filter="url(#glow)" />
    <!-- Left Plate Outer -->
    <rect x="-160" y="-60" width="15" height="120" rx="6" fill="#f4f4f5" />
    
    <!-- Right Plate Inner -->
    <rect x="110" y="-40" width="30" height="80" rx="10" fill="url(#orange-grad)" filter="url(#glow)" />
    <!-- Right Plate Outer -->
    <rect x="145" y="-60" width="15" height="120" rx="6" fill="#f4f4f5" />
  </g>
</svg>